name: Deploy Pages (chess + geophoto + structuralsketcher)

# Un solo workflow para todo el sitio de Pages: actions/deploy-pages reemplaza
# el sitio completo en cada ejecución, así que no puede haber un workflow por
# app (el último en correr borraría a los demás). Este construye GeoPhoto
# Studio y StructuralSketcher, copia el ajedrez (estático, sin build) y agrega
# una página de inicio.

on:
  push:
    branches: [main, claude/zen-dirac-fj3fl5, claude/structural-sketcher-webapp-ew1xt8, claude/quirky-galileo-gjmork]
    paths:
      - 'chess/**'
      - 'geophoto/**'
      - 'structuralsketcher/**'
      - 'pages/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            geophoto/package-lock.json
            structuralsketcher/package-lock.json

      - name: Build GeoPhoto Studio
        working-directory: geophoto
        run: |
          npm ci
          npm run build
        env:
          GITHUB_PAGES: 'true'
          # La base sale del nombre del repo, así un renombrado no rompe las rutas.
          VITE_BASE: '/${{ github.event.repository.name }}/geophoto/'

      - name: Build StructuralSketcher
        working-directory: structuralsketcher
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
        env:
          VITE_BASE: '/${{ github.event.repository.name }}/structuralsketcher/'

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r pages/. _site/

          mkdir -p _site/geophoto
          cp -r geophoto/dist/. _site/geophoto/

          # El ajedrez no tiene build: es HTML/CSS/JS estático servido tal cual.
          mkdir -p _site/chess
          cp chess/index.html chess/styles.css _site/chess/
          cp -r chess/src _site/chess/src
          cp -r chess/vendor _site/chess/vendor

          mkdir -p _site/structuralsketcher
          cp -r structuralsketcher/dist/. _site/structuralsketcher/

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
