name: Deploy Pages (chess + geophoto + structuralsketcher)

# Un solo workflow para todo el sitio de Pages: actions/deploy-pages reemplaza
# el sitio completo en cada ejecución, así que no puede haber un workflow por
# app (el último en correr borraría a los demás). Este construye GeoPhoto
# Studio y StructuralSketcher, copia el ajedrez (estático, sin build) y agrega
# una página de inicio.

on:
  push:
    branches: [main, claude/zen-dirac-fj3fl5, claude/structural-sketcher-webapp-ew1xt8, claude/quirky-galileo-gjmork]
    paths:
      - 'chess/**'
      - 'geophoto/**'
      - 'structuralsketcher/**'
      - 'pages/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch: {}
  # Cada seis horas, para refrescar stats.json (visitas por país).
  schedule:
    - cron: '23 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            geophoto/package-lock.json
            structuralsketcher/package-lock.json

      - name: Build GeoPhoto Studio
        working-directory: geophoto
        run: |
          npm ci
          npm run build
        env:
          GITHUB_PAGES: 'true'
          # La base sale del nombre del repo, así un renombrado no rompe las rutas.
          VITE_BASE: '/${{ github.event.repository.name }}/geophoto/'

      - name: Build StructuralSketcher
        working-directory: structuralsketcher
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
        env:
          VITE_BASE: '/${{ github.event.repository.name }}/structuralsketcher/'

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r pages/. _site/

          mkdir -p _site/geophoto
          cp -r geophoto/dist/. _site/geophoto/

          # El ajedrez no tiene build: es HTML/CSS/JS estático servido tal cual.
          mkdir -p _site/chess
          cp chess/index.html chess/styles.css _site/chess/
          cp -r chess/src _site/chess/src
          cp -r chess/vendor _site/chess/vendor

          mkdir -p _site/structuralsketcher
          cp -r structuralsketcher/dist/. _site/structuralsketcher/

      # Visitas por país para el mapa de la portada. El token de GoatCounter
      # (permiso «Read statistics») va en el secreto GOATCOUNTER_TOKEN; sin él,
      # o si la API falla, la portada muestra el mapa vacío y el sitio se
      # publica igual.
      - name: Visit stats (GoatCounter)
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN }}
          GOATCOUNTER_SITE: https://mespinoza-geo.goatcounter.com
        run: |
          if [ -z "$GOATCOUNTER_TOKEN" ]; then echo "Sin GOATCOUNTER_TOKEN: no se escribe stats.json"; exit 0; fi
          end=$(date -u +%Y-%m-%dT%H:00:00Z)
          all='[]'; offset=0
          while :; do
            page=$(curl -sfS -H "Authorization: Bearer $GOATCOUNTER_TOKEN" \
              "$GOATCOUNTER_SITE/api/v0/stats/locations?start=2020-01-01T00:00:00Z&end=$end&limit=100&offset=$offset") \
              || { echo "::warning::GoatCounter no respondió; se publica sin stats.json"; exit 0; }
            all=$(jq -c --argjson a "$all" '$a + [.stats[] | {id, name, count}]' <<<"$page")
            [ "$(jq -r '.more' <<<"$page")" = "true" ] || break
            offset=$((offset + 100)); [ $offset -lt 1000 ] || break
          done
          jq -n --argjson c "$all" --arg u "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{updated: $u, countries: ($c | map(select(.id != null and .id != "")))}' > _site/stats.json
          echo "stats.json: $(jq '.countries | length' _site/stats.json) países"

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
